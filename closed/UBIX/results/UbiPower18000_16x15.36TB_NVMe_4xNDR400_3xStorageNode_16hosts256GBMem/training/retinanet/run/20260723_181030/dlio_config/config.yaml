workload:
  model:
    name: retinanet
    type: cnn
  framework: pytorch
  workflow:
    generate_data: false
    train: true
    checkpoint: false
  dataset:
    data_folder: /mnt/ubix/retinanet
    format: jpeg
    num_files_train: 68090280
    num_samples_per_file: 1
    record_length_bytes: 322957
    skip_listing: true
    listing_validation_interval: 10000
  reader:
    data_loader: pytorch
    batch_size: 24
    read_threads: 4
    multiprocessing_context: fork
    file_shuffle: seed
    sample_shuffle: seed
    prefetch_size: 4
  train:
    epochs: 8
    computation_time: 0.04755
  metric:
    au: 0.85
