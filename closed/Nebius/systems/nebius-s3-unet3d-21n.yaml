system_under_test:
  solution:
    submission_name: nebius-s3-unet3d-21n
    friendly_description: Nebius managed S3 object storage via s3dlio - UNet3D training
      (21 clients x 1 emulated b200 accelerator)
    architecture:
      storage_location: remote
      benchmark_API: object
      product_API: object
      client_footprint: open_source
      client_installation: in_box
    capabilities:
      multi_host: true
      simultaneous_write: true
      simultaneous_read: true
      remap_time_in_seconds: 0
    usable_capacity_tib: 250
    availability: available
  deployment: cloud
  clients:
  - friendly_description: 'Nebius CPU client running MLPerf Storage emulated accelerators;
      NIC: NVIDIA ConnectX-8, 400 Gb/s ethernet, shared among VMs on the host'
    chassis:
      model_name: cpu-d3
      cpu_model: AMD EPYC-Genoa Processor
      cpu_qty: 1
      cpu_cores: 32
      memory_capacity: 29
    networking:
    - type: ethernet
      state: up
      unit_count: 1
      speed: 400
      traffic:
      - data
    sysctl:
