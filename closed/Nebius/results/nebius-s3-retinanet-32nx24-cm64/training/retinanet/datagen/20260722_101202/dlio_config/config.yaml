workload:
  model:
    name: retinanet
    type: cnn
  framework: pytorch
  workflow:
    generate_data: true
    train: false
    checkpoint: false
  dataset:
    data_folder: s3://mlc-s3/retinanet/submission/data_32n_cm64/retinanet
    format: jpeg
    num_files_train: 34045139
    num_samples_per_file: 1
    record_length_bytes: 322957
    num_subfolders_train: 3404
    skip_listing: true
    listing_validation_interval: 10000
  storage:
    storage_type: s3
    storage_root: mlc-s3
    storage_options:
      storage_library: s3dlio
      uri_scheme: s3
    s3_force_path_style: true
