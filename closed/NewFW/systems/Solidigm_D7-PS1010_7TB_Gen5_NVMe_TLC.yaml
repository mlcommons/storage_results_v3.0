system_under_test:
  solution:
    submission_name: Solidigm_D7-PS1010_7TB_Gen5_NVMe_TLC
    friendly_description: >
      Single-host MLPerf Storage submission using a Lenovo ThinkSystem SR665 V3
      with dual AMD EPYC 9655 processors and direct-attached Solidigm NVMe SSDs.
      Primary benchmark storage: Solidigm D7-PS1010 TLC 7.68TB (PCIe Gen5).
      Storage access type: Direct-attached media (Local).
    architecture:
      storage_location: local
      benchmark_API: file
      product_API: block
      client_footprint: open_source
      client_installation: in_box
    capabilities:
      multi_host: false
      simultaneous_write: false
      simultaneous_read: false
      remap_time_in_seconds: 22
    usable_capacity_tib: 7
    availability: available

  deployment: onprem

  product_nodes:
    - friendly_description: Lenovo ThinkSystem SR665 V3 storage node with direct-attached Solidigm NVMe SSDs
      quantity: 1
      chassis:
        model_name: Lenovo ThinkSystem SR665 V3
        rack_units: 2
        cpu_model: AMD EPYC 9655 96-Core Processor
        cpu_qty: 2
        cpu_cores: 192
        memory_capacity: 377
        power:
          min_psus_active: 1
          psus_configured:
            - unit_count: 1
              inlet_voltage: 220
              nameplate_power_watts: 1800
              efficiency: Platinum
            - unit_count: 1
              inlet_voltage: 220
              nameplate_power_watts: 1800
              efficiency: Platinum
      networking:
        - type: ethernet
          state: down
          unit_count: 6
      drives:
        - unit_count: 1
          vendor_name: Solidigm
          model_name: SOLIDIGM SB5PH27X076T
          interface: nvme
          media_type: TLC
          capacity_in_GB: 7680
        - unit_count: 1
          vendor_name: Solidigm
          model_name: SOLIDIGM SBFPF2BV614T
          interface: nvme
          media_type: QLC
          capacity_in_GB: 61440
      operating_system:
        name: Ubuntu
        version: 24.04 LTS (Noble Numbat)
      sysctl:
        - name: vm.drop_caches
          value: "3"
        - name: fs.aio-max-nr
          value: "65536"
        - name: fs.file-max
          value: "9223372036854775807"
        - name: fs.nr_open
          value: "1048576"
        - name: fs.inotify.max_user_watches
          value: "65536"
        - name: kernel.io_uring_disabled
          value: "0"
        - name: kernel.numa_balancing
          value: "1"
        - name: kernel.pid_max
          value: "4194304"
        - name: kernel.sched_autogroup_enabled
          value: "1"
        - name: kernel.shmall
          value: "18446744073692774399"
        - name: kernel.shmmax
          value: "18446744073692774399"
        - name: kernel.threads-max
          value: "3089796"
        - name: net.core.busy_poll
          value: "0"
        - name: net.core.busy_read
          value: "0"
        - name: net.core.default_qdisc
          value: "pfifo_fast"
        - name: net.core.netdev_budget
