# Storage-node details are documented in the companion StorMeshAI.pdf because
# the MLPerf Storage v3.0 system schema used here does not accept storage_servers.
# Confirmed storage configuration: 3 storage nodes, each with 9 x 4.76 TiB NVMe.
# Raw capacity is 128.52 TiB; usable capacity is 42.84 TiB after 3x replication.
---
system_under_test:
  solution:
    submission_name: "StorMeshAI"
    friendly_description: "StorMeshAI remote parallel filesystem. File payload I/O uses two active-active 400 Gb/s NDR InfiniBand/RDMA ports with StorMeshAI software multipath and per-chunk hash-based path selection; the independent ports are not Linux-bonded. A 50 Gb/s Ethernet bond carries management, control-plane, and filesystem metadata traffic only."
    architecture:
      storage_location: "remote"
      benchmark_API: "file"
      product_API: "file"
      client_footprint: "closed_source"
      client_installation: "installable"
    capabilities:
      multi_host: true
      simultaneous_write: true
      simultaneous_read: true
      remap_time_in_seconds: 0
    usable_capacity_tib: 42.84
    availability: "available"
  deployment: "cloud"
  clients:
  - friendly_description: "client node ubuntu"
    chassis:
      model_name: "R620 G50"
      cpu_model: "Intel(R) Xeon(R) Platinum 8458P"
      cpu_qty: 2
      cpu_cores: 88
      memory_capacity: 1007
    networking:
    - type: "ethernet"
      speed: 50
      state: "up"
      unit_count: 1
      traffic:
      - management
      - metadata
    - type: "infiniband"
      speed: 400
      state: "up"
      unit_count: 2
      traffic:
      - data
    sysctl:
    - name: "fs.aio-max-nr"
      value: "65536"
    - name: "fs.file-max"
      value: "9223372036854775807"
    - name: "fs.nr_open"
      value: "1048576"
    - name: "fs.inotify.max_user_watches"
      value: "1048576"
    - name: "kernel.io_uring_disabled"
      value: "0"
    - name: "kernel.numa_balancing"
      value: "1"
    - name: "kernel.pid_max"
      value: "4194304"
    - name: "kernel.sched_autogroup_enabled"
      value: "1"
    - name: "kernel.shmall"
      value: "18446744073692774399"
    - name: "kernel.shmmax"
      value: "18446744073692774399"
    - name: "kernel.threads-max"
      value: "8252738"
    - name: "net.core.busy_poll"
      value: "0"
    - name: "net.core.busy_read"
      value: "0"
    - name: "net.core.default_qdisc"
      value: "fq_codel"
    - name: "net.core.netdev_budget"
      value: "300"
    - name: "net.core.netdev_budget_usecs"
      value: "2000"
    - name: "net.core.netdev_max_backlog"
      value: "1000"
    - name: "net.core.optmem_max"
      value: "131072"
    - name: "net.core.rmem_default"
      value: "212992"
    - name: "net.core.rmem_max"
      value: "212992"
    - name: "net.core.somaxconn"
      value: "4096"
    - name: "net.core.wmem_default"
      value: "212992"
    - name: "net.core.wmem_max"
      value: "212992"
    - name: "net.ipv4.ip_local_port_range"
      value: "32768 60999"
    - name: "net.ipv4.tcp_congestion_control"
      value: "cubic"
    - name: "net.ipv4.tcp_low_latency"
      value: "0"
    - name: "net.ipv4.tcp_mtu_probing"
      value: "0"
    - name: "net.ipv4.tcp_no_metrics_save"
      value: "0"
    - name: "net.ipv4.tcp_notsent_lowat"
      value: "4294967295"
    - name: "net.ipv4.tcp_rmem"
      value: "4096 131072 6291456"
    - name: "net.ipv4.tcp_sack"
      value: "1"
    - name: "net.ipv4.tcp_slow_start_after_idle"
      value: "1"
    - name: "net.ipv4.tcp_timestamps"
      value: "1"
    - name: "net.ipv4.tcp_window_scaling"
      value: "1"
    - name: "net.ipv4.tcp_wmem"
      value: "4096 16384 4194304"
    - name: "vm.dirty_background_bytes"
      value: "0"
    - name: "vm.dirty_background_ratio"
      value: "10"
    - name: "vm.dirty_bytes"
      value: "0"
    - name: "vm.dirty_expire_centisecs"
      value: "3000"
    - name: "vm.dirty_ratio"
      value: "20"
    - name: "vm.dirty_writeback_centisecs"
      value: "500"
