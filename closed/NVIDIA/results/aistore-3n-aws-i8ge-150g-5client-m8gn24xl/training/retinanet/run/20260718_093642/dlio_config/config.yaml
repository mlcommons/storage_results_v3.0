workload:
  model:
    name: retinanet
    type: cnn
  framework: pytorch
  workflow:
    generate_data: false
    train: true
    checkpoint: false
  dataset:
    data_folder: data/final/retinanet-m8gn-exact-v3/retinanet
    format: jpeg
    num_files_train: 31917318
    num_samples_per_file: 1
    record_length_bytes: 322957
    num_subfolders_train: 3192
    skip_listing: true
    listing_validation_interval: 10000
  reader:
    data_loader: pytorch
    batch_size: 24
    read_threads: 1
    multiprocessing_context: fork
    file_shuffle: seed
    sample_shuffle: seed
  train:
    epochs: 8
    computation_time: 0.04755
  metric:
    au: 0.85
  storage:
    storage_options:
      prefetch_window: 16
      storage_library: s3dlio
      uri_scheme: s3
    storage_type: s3
    storage_root: mlp-retinanet-aws-m8gn
    s3_force_path_style: true
