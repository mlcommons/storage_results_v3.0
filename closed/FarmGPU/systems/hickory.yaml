system_under_test:
  solution:
    submission_name: hickory
    friendly_description: FarmGPU 'hickory' WEKA parallel filesystem cluster - DPDK/RoCE clients on NVIDIA
      ConnectX-8 dual-400G
    architecture:
      storage_location: remote
      benchmark_API: file
      product_API: file
      client_footprint: closed_source
      client_installation: installable
    capabilities:
      multi_host: true
      simultaneous_write: true
      simultaneous_read: true
      remap_time_in_seconds: 0
    usable_capacity_tib: 646.58
    availability: preview
  deployment: onprem
  product_nodes:
  - friendly_description: FarmGPU 'hickory' WEKA Data Platform 5.1.2.420-cx8 storage backend node (shared
      parallel filesystem 'default', POSIX file API; DPDK/RoCEv2 client transport). AMD EPYC 9655 96c/1-socket,
      1511 GiB, 20x Solidigm D7-PS1010 7.68TB TLC NVMe (SB5PH27X076T), 2x NVIDIA ConnectX-8 dual-400G RoCEv2. Two isolated 400G storage fabrics
      (A and B, each on its own VLAN), plus a separate out-of-band management network. Aggregate line rate ~800 GB/s. PSU
      nameplate is a representative value (2x2000W Titanium @240V) pending confirmation from the hickory
      chassis datasheet.
    quantity: 8
    chassis:
      model_name: WEKA hickory storage backend (AMD EPYC 9655, 2U)
      rack_units: 2
      cpu_model: AMD EPYC 9655
      cpu_qty: 1
      cpu_cores: 96
      memory_capacity: 1511
      power:
        min_psus_active: 1
        psus_configured:
        - inlet_voltage: 240
          nameplate_power_watts: 2000
          efficiency: Titanium
          unit_count: 2
    networking:
    - type: ethernet
      state: up
      speed: 400
      unit_count: 2
      traffic:
      - data
      - backend
    - type: ethernet
      state: up
      speed: 1
      unit_count: 1
      traffic:
      - management
    drives:
    - vendor_name: Solidigm
      model_name: SOLIDIGM SB5PH27X076T
      interface: nvme
      media_type: TLC
      capacity_in_GB: 7680
      unit_count: 20
    operating_system:
      name: WEKA Data Platform
      version: 5.1.2.420-cx8
  total_rack_units: 16
  clients:
  - friendly_description: FarmGPU parsnip load client (Intel Xeon 6781P, 1007 GiB, 4x NVIDIA ConnectX-8
      400G dual-rail RoCE) - MLPerf Storage kvcache CLOSED, llama3.1-8b sanctioned 3-option sweep, 15-client
      run (8x parsnip + 7x potato), np15; WEKA 'hickory' backend
    chassis:
